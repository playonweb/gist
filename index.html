<!DOCTYPE html>
<html lang="en" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gist Apps | App Directory</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Gist Apps | App Directory" />
    <meta name="description" content="A curated directory of interactive web applications and tools built with modern web technologies." />

    <!-- Application Logic -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('appDirectory', () => ({
                apps: [],
                search: '',
                category: '',
                loading: true,
                error: null,
                theme: localStorage.getItem('gist-theme') || 'system',

                async init() {
                    this.applyTheme();
                    try {
                        let appData = /*__APPS_JSON__*/ [];
                        if (appData.length === 0) {
                            const response = await fetch('apps.json');
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            appData = await response.json();
                        }
                        this.apps = appData;
                        
                        // New grid spans for a dynamic masonry-like bento
                        const spans = [
                            'md:col-span-2 md:row-span-2',
                            'md:col-span-1 md:row-span-1',
                            'md:col-span-1 md:row-span-2',
                            'md:col-span-2 md:row-span-1'
                        ];
                        
                        this.apps = this.apps.map((app, idx) => ({
                            ...app,
                            category: app.category && app.category.trim() !== '' ? app.category.trim() : 'Uncategorized',
                            _span: spans[idx % spans.length]
                        }));
                    } catch (e) {
                        this.error = 'Unable to load application directory. Run ./gist build first.';
                    } finally {
                        this.loading = false;
                    }
                },

                toggleTheme() {
                    if (this.theme === 'system') this.theme = 'dark';
                    else if (this.theme === 'dark') this.theme = 'light';
                    else this.theme = 'system';
                    
                    localStorage.setItem('gist-theme', this.theme);
                    this.applyTheme();
                },

                applyTheme() {
                    const isDark = this.theme === 'dark' || 
                        (this.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    
                    if (isDark) {
                        document.body.classList.remove('light-mode');
                        document.body.classList.add('dark-mode');
                    } else {
                        document.body.classList.remove('dark-mode');
                        document.body.classList.add('light-mode');
                    }
                },

                get uniqueCategories() {
                    const categories = this.apps.map(app => app.category).filter(Boolean);
                    return [...new Set(categories)].sort();
                },

                get filteredApps() {
                    const searchStr = (this.search || '').toLowerCase();
                    return this.apps.filter(app => {
                        const matchesSearch = (app.title || '').toLowerCase().includes(searchStr) ||
                            (app.description || '').toLowerCase().includes(searchStr);
                        const matchesCategory = this.category === '' || app.category === this.category;
                        return matchesSearch && matchesCategory;
                    });
                }
            }));
        });
    </script>

    <!-- Dependencies -->
    <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #8b5cf6;
        --color-secondary: #ec4899;
        --color-accent: #06b6d4;
      }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        [x-cloak] { display: none !important; }
        
        :root {
            --bg-base: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-surface: rgba(30, 41, 59, 0.7);
            --card-bg-gradient: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            --border-light: rgba(255, 255, 255, 0.1);
            --search-bg: rgba(15, 23, 42, 0.6);
            --img-fallback-bg: #0f172a;
            --orb-1: rgba(139, 92, 246, 0.2);
            --orb-2: rgba(6, 182, 212, 0.2);
            --hover-border: rgba(139, 92, 246, 0.5);
            --select-bg: #1e293b;
        }

        .light-mode {
            --bg-base: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-surface: rgba(255, 255, 255, 0.7);
            --card-bg-gradient: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(241, 245, 249, 0.9) 100%);
            --border-light: rgba(0, 0, 0, 0.1);
            --search-bg: rgba(255, 255, 255, 0.8);
            --img-fallback-bg: #e2e8f0;
            --orb-1: rgba(139, 92, 246, 0.1);
            --orb-2: rgba(6, 182, 212, 0.1);
            --hover-border: rgba(139, 92, 246, 0.7);
            --select-bg: #ffffff;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Abstract ambient background elements */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
            transition: background 0.3s ease;
        }
        .orb-1 {
            width: 40vw;
            height: 40vw;
            background: var(--orb-1);
            top: -10%;
            left: -10%;
        }
        .orb-2 {
            width: 30vw;
            height: 30vw;
            background: var(--orb-2);
            bottom: -10%;
            right: -5%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .premium-card {
            position: relative;
            background: var(--card-bg-gradient);
            border: 1px solid var(--border-light);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .premium-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--hover-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 0 20px rgba(139, 92, 246, 0.2);
            z-index: 10;
        }
        
        .premium-card:hover::before {
            transform: translateX(100%);
        }

        .search-glass {
            background: var(--search-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            transition: all 0.3s;
        }
        .search-glass:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .text-gradient {
            background: linear-gradient(to right, #c4b5fd, #f9a8d4, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .light-mode .text-gradient {
            background: linear-gradient(to right, #8b5cf6, #ec4899, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-border); }
        
        select option {
            background: var(--select-bg);
            color: var(--text-main);
        }
    </style>
</head>

<body x-data="appDirectory" class="min-h-screen flex flex-col relative selection:bg-primary selection:text-white">

    <!-- Ambient Background -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel py-4 px-6 lg:px-12 mt-4 mx-4 lg:mx-8 rounded-2xl mb-12">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            
            <!-- Logo -->
            <div class="flex items-center gap-4 group cursor-pointer" @click="window.location.reload()">
                <img src="favicon.svg" alt="Gist Apps Logo" class="w-12 h-12 rounded-xl shadow-[0_0_15px_rgba(139,92,246,0.3)] transform group-hover:rotate-12 group-hover:scale-110 transition-all duration-500">
                <h1 class="text-3xl font-extrabold tracking-tight">
                    Gist<span class="text-gradient">Apps</span>
                </h1>
            </div>

            <!-- Controls -->
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                
                <!-- Theme Toggle -->
                <button @click="toggleTheme" 
                        class="p-3 rounded-xl border search-glass hover:border-primary transition-all flex items-center justify-center gap-2 group w-full sm:w-auto">
                    <i :class="theme === 'system' ? 'fa-solid fa-circle-half-stroke' : (theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun')" 
                       class="text-primary text-lg group-hover:rotate-12 transition-transform"></i>
                    <span class="text-[10px] uppercase font-bold tracking-widest sm:hidden" x-text="theme"></span>
                </button>

                <!-- Search Input -->
                <div class="search-glass flex items-center w-full sm:w-80 rounded-xl px-4 py-2.5">
                    <i class="fa-solid fa-magnifying-glass mr-3" style="color: var(--text-muted)"></i>
                    <input type="text" x-model="search" placeholder="Discover applications..."
                        class="bg-transparent border-none outline-none w-full font-medium text-sm" style="color: var(--text-main)">
                </div>

                <!-- Category Filter -->
                <div class="search-glass relative rounded-xl flex items-center w-full sm:w-48">
                    <i class="fa-solid fa-filter absolute left-4" style="color: var(--text-muted)"></i>
                    <select x-model="category"
                        class="bg-transparent border-none outline-none w-full py-2.5 pl-10 pr-4 appearance-none cursor-pointer font-medium text-sm" style="color: var(--text-main)">
                        <option value="">All Categories</option>
                        <template x-for="cat in uniqueCategories" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 pointer-events-none text-xs" style="color: var(--text-muted)"></i>
                </div>
                
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-[1600px] mx-auto px-4 sm:px-8 lg:px-12 pb-20">

        <!-- Header Intro -->
        <div class="mb-16 text-center max-w-2xl mx-auto" x-init="gsap.from($el, { opacity: 0, y: 30, duration: 1, ease: 'power3.out' })">
            <h2 class="text-5xl font-extrabold mb-6">Explore the <span class="text-gradient">Universe</span> of Apps</h2>
            <p class="text-lg leading-relaxed" style="color: var(--text-muted)">A curated collection of modern, interactive web experiences built for the future. Discover, run, and get inspired.</p>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-32" x-cloak>
            <div class="relative w-20 h-20">
                <div class="absolute inset-0 rounded-full border-t-2 border-primary animate-spin"></div>
                <div class="absolute inset-2 rounded-full border-r-2 border-secondary animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
            </div>
            <p class="mt-6 font-medium tracking-widest uppercase text-sm" style="color: var(--text-muted)">Initializing...</p>
        </div>

        <!-- Error -->
        <div x-show="error" class="glass-panel p-8 rounded-2xl max-w-lg mx-auto text-center" x-cloak>
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-400 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Connection Failed</h3>
            <p class="mb-6" style="color: var(--text-muted)" x-text="error"></p>
            <button @click="loading = true; error = null; init()"
                class="px-6 py-3 search-glass hover:border-primary rounded-xl transition-colors font-semibold">
                Retry Connection
            </button>
        </div>

        <!-- App Grid -->
        <!-- Added grid-flow-dense to prevent gaps from variable spans -->
        <div x-show="!loading && !error" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 grid-flow-row-dense auto-rows-[250px] gap-6" x-cloak>
            <template x-for="(app, index) in filteredApps" :key="app.path">
                <a :href="app.path" 
                   :class="app._span"
                   class="premium-card group block h-full flex flex-col animate-fade-in-up">
                   
                    <!-- Media Area -->
                    <div class="relative h-1/2 flex-shrink-0 overflow-hidden flex items-center justify-center" style="background: var(--img-fallback-bg)">
                        <!-- We use Alpine to check if the image fails loading -->
                        <div x-data="{ imageBroken: false }" class="w-full h-full">
                            <template x-if="app.image && !imageBroken">
                                <img :src="app.image" :alt="app.title" @error="imageBroken = true"
                                     class="w-full h-full object-cover group-hover:scale-110 group-hover:rotate-2 transition-all duration-700">
                            </template>
                            
                            <template x-if="(!app.image || imageBroken) && app.icon">
                                <div class="w-full h-full flex items-center justify-center">
                                    <i :class="app.icon + ' text-6xl group-hover:text-primary transition-colors duration-500 drop-shadow-2xl'" style="color: var(--text-muted)"></i>
                                </div>
                            </template>
                            
                            <template x-if="(!app.image || imageBroken) && !app.icon">
                                <div class="w-full h-full flex items-center justify-center">
                                    <div class="w-24 h-24 rounded-full flex items-center justify-center group-hover:bg-primary/20 transition-colors duration-500" style="background: var(--border-light)">
                                        <i class="fa-solid fa-rocket text-3xl group-hover:text-primary" style="color: var(--text-muted)"></i>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Category Tag -->
                        <div class="absolute top-4 right-4 px-3 py-1 backdrop-blur-md rounded-full text-xs font-bold uppercase tracking-wider" 
                             style="background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2);" 
                             x-text="app.category"></div>
                    </div>

                    <!-- Details Area -->
                    <!-- Removed solid background to let card-bg-gradient show through -->
                    <div class="p-6 flex flex-col flex-grow relative z-10">
                        <h3 class="text-2xl font-bold mb-2 group-hover:text-primary transition-colors" x-text="app.title"></h3>
                        <p class="text-sm line-clamp-3 mb-4 flex-grow leading-relaxed" style="color: var(--text-muted)" x-text="app.description"></p>
                        
                        <div class="mt-auto flex items-center justify-between text-sm font-bold transition-colors z-20" style="color: var(--text-muted)">
                            <div class="flex items-center gap-2">
                                <span class="group-hover:text-primary transition-colors">Launch App</span>
                                <i class="fa-solid fa-arrow-right transform group-hover:translate-x-2 group-hover:text-primary transition-all"></i>
                            </div>
                            <button @click.prevent="window.location.href = app.path + '#install'" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors group/install relative" title="Install App">
                                <i class="fa-solid fa-download group-hover/install:text-primary transition-colors text-lg"></i>
                            </button>
                        </div>
                    </div>
                </a>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="!loading && !error && filteredApps.length === 0" class="text-center py-32" x-cloak>
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full mb-6" style="background: var(--border-light)">
                <i class="fa-solid fa-ghost text-4xl" style="color: var(--text-muted)"></i>
            </div>
            <h3 class="text-2xl font-bold mb-2">No apps found</h3>
            <p style="color: var(--text-muted)">Expand your search to discover more applications.</p>
        </div>

    </main>

</body>
</html>
