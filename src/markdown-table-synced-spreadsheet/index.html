    html, body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Ensure Univer Sheet container stretches smoothly */
    #univer-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Resizer bar styling with extended touch hit area */
    .resizer {
      background-color: #f1f5f9;
      z-index: 30;
      transition: background-color 0.2s ease;
      user-select: none;
      touch-action: none;
      position: relative;
    }
    .dark .resizer {
      background-color: #1e293b;
    }
    .dark .resizer:hover, .dark .resizer.is-dragging {
      background-color: #334155 !important;
    }
    .resizer:hover, .resizer.is-dragging {
      background-color: #cbd5e1 !important;
    }
    /* Invisible pseudo-element expander to make touch grab target at least 24px */
    .resizer::after {
      content: '';
      position: absolute;
      inset: -8px;
      z-index: 1;
    }

    /* Temporary full-screen drag overlay to prevent canvas event hijacking */
    .drag-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      user-select: none;
    }

    /* Hide scrollbar for mobile header row */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* Custom scrollbar for markdown editor */
    textarea::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .dark textarea::-webkit-scrollbar-track {
      background: #0f172a;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark textarea::-webkit-scrollbar-thumb {
      background: #334155;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .dark textarea::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* File drag-and-drop dropzone indicator */
    #dropzone-overlay {
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
  </style>
</head>

          <div id="univer-container" class="absolute inset-0"></div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Sample Markdown Datasets
    const SAMPLES = {
      sales: `| ID | Product Name | Category | Stock | Price ($) | Rating |
|---|---|---|---|---|---|
| 101 | Wireless Headphones | Electronics | 120 | 89.99 | 4.8 |
| 102 | Ergonomic Chair | Furniture | 45 | 249.50 | 4.6 |
| 103 | Mechanical Keyboard | Electronics | 85 | 119.00 | 4.9 |
| 104 | Stainless Steel Water Bottle | Home & Kitchen | 300 | 19.95 | 4.5 |
| 105 | Noise Cancelling Earbuds | Electronics | 60 | 159.99 | 4.7 |
| 106 | Standing Desk | Furniture | 20 | 499.00 | 4.8 |`,
      
      project: `| Task ID | Description | Assignee | Priority | Status | Due Date |
|:---|:---|:---|:---:|:---:|:---:|
| T-1001 | Design Landing Page Wireframes | Sarah M. | High | In Progress | 2026-08-15 |
| T-1002 | Setup Authentication API | Alex K. | Urgent | Completed | 2026-08-10 |
| T-1003 | Perform Security Audit | Dev Team | Medium | Pending | 2026-08-22 |
| T-1004 | Write User Documentation | Elena R. | Low | Draft | 2026-08-28 |
| T-1005 | Optimize Database Queries | Alex K. | High | In Review | 2026-08-18 |`
    };

    // State & Flags to prevent recursive feedback loops
    let univerAPI = null;
    let currentWorkbook = null;
    let isSyncingFromMarkdown = false;
    let isSyncingFromSheet = false;
    let syncDebounceTimer = null;
    let statusResetTimer = null;

    // UI Elements
    const mdInput = document.getElementById('markdown-input');
    const statRows = document.getElementById('stat-rows');
    const statCols = document.getElementById('stat-cols');
    const syncStatus = document.getElementById('sync-status');
    const syncText = document.getElementById('sync-text');

    /**
     * Parse raw Markdown text into a 2D Array matrix
     */
    function parseMarkdownTable(text) {
      if (!text || typeof text !== 'string') return [];
      
      const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const matrix = [];

      for (let line of lines) {
        // Skip delimiter line e.g., |---|:---|---:| or |---|
        if (/^\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?$/.test(line)) {
          continue;
        }

        // Strip leading and trailing pipe if present
        let cleanLine = line;
        if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
        if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);

        // Split by column divider pipe
        const cells = cleanLine.split('|').map(cell => cell.trim().replace(/\\\|/g, '|'));

        if (cells.length > 0) {
          matrix.push(cells);
        }
      }

      return matrix;
    }

    /**
     * Converts 2D matrix into Univer CellData format object
     */
    function matrixToCellData(matrix) {
      const cellData = {};
      matrix.forEach((row, rIdx) => {
        cellData[rIdx] = {};
        row.forEach((cellVal, cIdx) => {
          let formattedValue = cellVal;
          // Auto-convert numeric strings to numbers
          if (cellVal !== '' && !isNaN(cellVal)) {
            formattedValue = Number(cellVal);
          }
          cellData[rIdx][cIdx] = {
            v: formattedValue
          };
        });
      });
      return cellData;
    }

    /**
     * Extracts active sheet matrix and converts to formatted Markdown Table string
     */
    function getSheetMatrix() {
      if (!univerAPI) return [];
      try {
        const workbook = univerAPI.getActiveWorkbook();
        if (!workbook) return [];
        const sheet = workbook.getActiveSheet();
        if (!sheet) return [];

        let cellData = null;
        if (typeof sheet.getSheet === 'function') {
          cellData = sheet.getSheet().getSnapshot()?.cellData;
        } else if (typeof sheet.getSnapshot === 'function') {
          cellData = sheet.getSnapshot()?.cellData;
        }

        if (cellData) {
          const rowIndices = Object.keys(cellData).map(Number).sort((a, b) => a - b);
          if (rowIndices.length === 0) return [];

          const matrix = [];
          rowIndices.forEach(r => {
            matrix[r] = [];
            const colObj = cellData[r] || {};
            Object.keys(colObj).forEach(c => {
              const cIdx = Number(c);
              const cellObj = colObj[cIdx];
              let val = '';
              if (cellObj) {
                val = cellObj.v !== undefined && cellObj.v !== null ? cellObj.v : (cellObj.m || cellObj.p || '');
              }
              matrix[r][cIdx] = val;
            });
          });
          return matrix;
        }

        // Fallback: Use Range values
        const maxRows = Math.min(sheet.getMaxRows() || 30, 30);
        const maxCols = Math.min(sheet.getMaxColumns() || 15, 15);
        const range = sheet.getRange(0, 0, maxRows, maxCols);
        if (range && typeof range.getValues === 'function') {
          return range.getValues();
        }
      } catch (err) {
        console.error("Error reading sheet matrix:", err);
      }
      return [];
    }

    /**
     * Convert 2D matrix into clean, formatted Markdown table
     */
    function matrixToMarkdown(matrix) {
      if (!matrix || matrix.length === 0) return '';

      // Find non-empty bounds
      let maxR = -1;
      let maxC = -1;

      for (let r = 0; r < matrix.length; r++) {
        const row = matrix[r];
        if (!row) continue;
        for (let c = 0; c < row.length; c++) {
          const val = row[c];
          if (val !== null && val !== undefined && String(val).trim() !== '') {
            if (r > maxR) maxR = r;
            if (c > maxC) maxC = c;
          }
        }
      }

      if (maxR === -1 || maxC === -1) return '';

      const cleanRows = [];
      for (let r = 0; r <= maxR; r++) {
        const rowCells = [];
        for (let c = 0; c <= maxC; c++) {
          const cellVal = (matrix[r] && matrix[r][c] !== undefined && matrix[r][c] !== null) ? String(matrix[r][c]) : '';
          rowCells.push(cellVal.replace(/\|/g, '\\|'));
        }
        cleanRows.push(rowCells);
      }

      if (cleanRows.length === 0) return '';

      const numCols = maxC + 1;
      const colWidths = new Array(numCols).fill(0);

      cleanRows.forEach(row => {
        for (let c = 0; c < numCols; c++) {
          const val = row[c] || '';
          colWidths[c] = Math.max(colWidths[c], val.length);
        }
      });

      const lines = [];
      
      // Header row
      const header = cleanRows[0];
      const formattedHeader = '| ' + header.map((val, idx) => (val || '').padEnd(colWidths[idx])).join(' | ') + ' |';
      lines.push(formattedHeader);

      // Separator row
      const separator = '| ' + colWidths.map(w => '-'.repeat(Math.max(w, 3))).join(' | ') + ' |';
      lines.push(separator);

      // Data rows
      for (let r = 1; r < cleanRows.length; r++) {
        const row = cleanRows[r];
        const formattedRow = '| ' + colWidths.map((w, cIdx) => (row[cIdx] || '').padEnd(w)).join(' | ') + ' |';
        lines.push(formattedRow);
      }

      return lines.join('\n');
    }

    /**
     * Reads sheet cell edits and updates Markdown input box
     */
    function syncSheetToMarkdown() {
      if (isSyncingFromMarkdown) return;
      isSyncingFromSheet = true;

      try {
        const matrix = getSheetMatrix();
        const markdown = matrixToMarkdown(matrix);

        if (markdown && mdInput.value.trim() !== markdown.trim()) {
          mdInput.value = markdown;

          // Update statistics
          const parsedMatrix = parseMarkdownTable(markdown);
          const numRows = parsedMatrix.length;
          const numCols = parsedMatrix.reduce((max, r) => Math.max(max, r.length), 0);
          statRows.textContent = `${numRows} row${numRows !== 1 ? 's' : ''} detected`;
          statCols.textContent = `${numCols} column${numCols !== 1 ? 's' : ''} detected`;

          showSyncIndicator('Sheet → Markdown');
        }
      } catch (err) {
        console.error('Error syncing sheet to markdown:', err);
      } finally {
        setTimeout(() => {
          isSyncingFromSheet = false;
        }, 150);
      }
    }

    /**
     * Updates or re-creates the Univer Sheet with new parsed matrix data from Markdown
     */
    function updateSpreadsheet(matrix) {
      if (isSyncingFromSheet) return;
      isSyncingFromMarkdown = true;

      // Update statistics
      const numRows = matrix.length;
      const numCols = matrix.reduce((max, r) => Math.max(max, r.length), 0);
      statRows.textContent = `${numRows} row${numRows !== 1 ? 's' : ''} detected`;
      statCols.textContent = `${numCols} column${numCols !== 1 ? 's' : ''} detected`;

      if (!univerAPI) {
        isSyncingFromMarkdown = false;
        return;
      }

      try {
        const cellData = matrixToCellData(matrix);

        if (currentWorkbook) {
          try {
            const unitId = currentWorkbook.getId?.();
            if (unitId && univerAPI.disposeUnit) {
              univerAPI.disposeUnit(unitId);
            }
          } catch (e) {
            // Ignore safe teardown warnings
          }
        }

        currentWorkbook = univerAPI.createUniverSheet({
          id: 'md-sheet-' + Date.now(),
          name: 'Parsed Markdown',
          sheets: {
            'sheet-1': {
              id: 'sheet-1',
              name: 'Markdown Table',
              rowCount: Math.max(numRows + 10, 30),
              columnCount: Math.max(numCols + 5, 20),
              cellData: cellData
            }
          }
        });

        showSyncIndicator('Markdown → Sheet');
      } catch (err) {
        console.error('Error updating Univer sheet:', err);
      } finally {
        setTimeout(() => {
          isSyncingFromMarkdown = false;
        }, 150);
      }
    }

    /**
     * Format/Align Markdown table nicely inside textarea
     */
    function formatMarkdownTable() {
      const matrix = parseMarkdownTable(mdInput.value);
      if (matrix.length === 0) return;

      const formatted = matrixToMarkdown(matrix);
      if (formatted) {
        mdInput.value = formatted;
      }
    }

    /**
     * Displays a brief visual indicator when sync executes
     */
    function showSyncIndicator(direction) {
      clearTimeout(statusResetTimer);
      syncText.textContent = `Synced (${direction})`;
      syncStatus.className = 'ml-2 px-2.5 py-0.5 text-[10px] bg-blue-50 text-blue-600 rounded-full font-medium flex items-center gap-1.5 transition-all border border-blue-100/50 shadow-sm';
      
      statusResetTimer = setTimeout(() => {
        syncText.textContent = 'Live';
        syncStatus.className = 'ml-2 px-2.5 py-0.5 text-[10px] bg-emerald-50 text-emerald-600 rounded-full font-medium flex items-center gap-1.5 transition-all border border-emerald-100/50';
      }, 1200);
    }

    /**
     * Initialize Univer Sheets Preset and register listeners for bidirectional sync
     */
    function initUniver() {
      const { createUniver } = UniverPresets;
      const { LocaleType, mergeLocales } = UniverCore;
      const { UniverSheetsCorePreset } = UniverPresetSheetsCore;

      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialDark = currentTheme === 'dark' || (currentTheme === 'system' && prefersDark);

      const result = createUniver({
        locale: LocaleType.EN_US,
        darkMode: initialDark,
        locales: {
          [LocaleType.EN_US]: mergeLocales(UniverPresetSheetsCoreEnUS),
        },
        presets: [
          UniverSheetsCorePreset({
            container: 'univer-container',
          }),
        ],
      });

      univerAPI = result.univerAPI;

      // Listen to commands executed inside Univer sheet (cell edits, range changes, pasting)
      if (univerAPI && typeof univerAPI.onCommandExecuted === 'function') {
        univerAPI.onCommandExecuted(() => {
          if (isSyncingFromMarkdown) return;
          clearTimeout(syncDebounceTimer);
          syncDebounceTimer = setTimeout(() => {
            syncSheetToMarkdown();
          }, 300);
        });
      }

      // Load initial sample data
      mdInput.value = SAMPLES.sales;
      updateSpreadsheet(parseMarkdownTable(mdInput.value));
    }

    // Input Event Listener (Markdown -> Spreadsheet)
    let markdownInputTimer;
    mdInput.addEventListener('input', () => {
      clearTimeout(markdownInputTimer);
      markdownInputTimer = setTimeout(() => {
        const matrix = parseMarkdownTable(mdInput.value);
        updateSpreadsheet(matrix);
      }, 250);
    });

    // Sample Data Buttons
    bindClick('btn-sample-sales', () => {
      mdInput.value = SAMPLES.sales;
      updateSpreadsheet(parseMarkdownTable(mdInput.value));
    });

    bindClick('btn-sample-project', () => {
      mdInput.value = SAMPLES.project;
      updateSpreadsheet(parseMarkdownTable(mdInput.value));
    });

    bindClick('btn-clear', () => {
      mdInput.value = '';
      updateSpreadsheet([]);
    });

    function bindClick(baseId, handler) {
      const el1 = document.getElementById(baseId);
      const el2 = document.getElementById(baseId + '-mobile');
      if (el1) el1.addEventListener('click', handler);
      if (el2) el2.addEventListener('click', handler);
    }

    bindClick('btn-format', () => {
      formatMarkdownTable();
    });

    bindClick('btn-copy', () => {
      if (!mdInput.value) return;
      document.execCommand('copy');
      const btn = document.getElementById('btn-copy');
      if (btn) {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i> Copied!';
        setTimeout(() => btn.innerHTML = originalHTML, 1500);
      }
      const btnMobile = document.getElementById('btn-copy-mobile');
      if (btnMobile) {
        const originalHTMLMobile = btnMobile.innerHTML;
        btnMobile.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i> Copied!';
        setTimeout(() => btnMobile.innerHTML = originalHTMLMobile, 1500);
      }
    });

    // --- Import & Export Logic ---
    const fileUpload = document.getElementById('file-upload');
    const dropzoneOverlay = document.getElementById('dropzone-overlay');
    
    bindClick('btn-import', () => {
      fileUpload.click();
    });

    /**
     * Process an imported file (from file input or drag-and-drop)
     */
    function processImportFile(file) {
      if (!file) return;

      const reader = new FileReader();
      const ext = file.name.split('.').pop().toLowerCase();

      if (!['md', 'csv', 'xlsx', 'xls'].includes(ext)) {
        alert('Unsupported file format. Please drop a Markdown (.md), CSV (.csv), or Excel (.xlsx, .xls) file.');
        return;
      }

      reader.onload = (event) => {
        const data = event.target.result;
        
        if (ext === 'md') {
          mdInput.value = data;
          updateSpreadsheet(parseMarkdownTable(data));
        } else if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
          try {
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            // Format matrix and update both sheet and markdown view
            updateSpreadsheet(json);
            mdInput.value = matrixToMarkdown(json);
          } catch (err) {
            console.error('Error parsing spreadsheet file:', err);
            alert('Failed to parse file. Ensure it is a valid CSV/Excel file.');
          }
        }
      };

      if (ext === 'md') {
        reader.readAsText(file);
      } else {
        reader.readAsArrayBuffer(file);
      }
      
      // Reset file input
      fileUpload.value = '';
    }

    fileUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) processImportFile(file);
    });

    // Global Drag and Drop Event Listeners (Drop anywhere on app)
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        if (dropzoneOverlay) {
          dropzoneOverlay.classList.remove('opacity-0', 'invisible');
          dropzoneOverlay.classList.add('opacity-100', 'visible');
        }
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        if (dropzoneOverlay) {
          dropzoneOverlay.classList.add('opacity-0', 'invisible');
          dropzoneOverlay.classList.remove('opacity-100', 'visible');
        }
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      if (dropzoneOverlay) {
        dropzoneOverlay.classList.add('opacity-0', 'invisible');
        dropzoneOverlay.classList.remove('opacity-100', 'visible');
      }

      const files = e.dataTransfer ? e.dataTransfer.files : null;
      if (files && files.length > 0) {
        processImportFile(files[0]);
      }
    });

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    bindClick('btn-export-md', () => {
      const matrix = getSheetMatrix();
      const mdContent = matrixToMarkdown(matrix);
      if (!mdContent) return alert('Table is empty!');
      downloadFile(mdContent, 'export.md', 'text/markdown');
    });

    function exportSpreadsheet(format) {
      const matrix = getSheetMatrix();
      if (!matrix || matrix.length === 0) return alert('Table is empty!');
      try {
        const ws = XLSX.utils.aoa_to_sheet(matrix);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
        XLSX.writeFile(wb, 'export.' + format);
      } catch (err) {
        console.error('Error exporting spreadsheet:', err);
        alert('Failed to export file.');
      }
    }

    bindClick('btn-export-csv', () => exportSpreadsheet('csv'));
    bindClick('btn-export-xlsx', () => exportSpreadsheet('xlsx'));

    // Zoom State and Controls for Markdown Editor
    let currentZoom = 100; // 100%
    const minZoom = 60;
    const maxZoom = 200;
    const zoomStep = 10;
    const zoomLevelEl = document.getElementById('zoom-level');

    function applyZoom(zoom) {
      currentZoom = Math.max(minZoom, Math.min(maxZoom, zoom));
      if (zoomLevelEl) zoomLevelEl.textContent = `${currentZoom}%`;
      // Base font size is 13px
      const calculatedFontSize = (13 * (currentZoom / 100)).toFixed(1);
      mdInput.style.fontSize = `${calculatedFontSize}px`;
    }

    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');

    if (btnZoomIn) {
      btnZoomIn.addEventListener('click', () => applyZoom(currentZoom + zoomStep));
    }
    if (btnZoomOut) {
      btnZoomOut.addEventListener('click', () => applyZoom(currentZoom - zoomStep));
    }
    if (btnZoomReset) {
      btnZoomReset.addEventListener('click', () => applyZoom(100));
    }

    // Ctrl + / Ctrl - keyboard zoom shortcut when focused in textarea
    mdInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === '=' || e.key === '+') {
          e.preventDefault();
          applyZoom(currentZoom + zoomStep);
        } else if (e.key === '-') {
          e.preventDefault();
          applyZoom(currentZoom - zoomStep);
        } else if (e.key === '0') {
          e.preventDefault();
          applyZoom(100);
        }
      }
    });

    // --- Theme (Light / Dark / System) Management ---
    let currentTheme = localStorage.getItem('md_spreadsheet_theme') || 'system';
    const themeIconActive = document.getElementById('theme-icon-active');

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('md_spreadsheet_theme', theme);
      
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
      
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Sync Univer spreadsheet theme
      if (univerAPI && typeof univerAPI.toggleDarkMode === 'function') {
        univerAPI.toggleDarkMode(isDark);
      }

      // Update active toolbar theme icon
      if (themeIconActive) {
        if (theme === 'light') {
          themeIconActive.className = 'fa-regular fa-sun text-amber-500';
        } else if (theme === 'dark') {
          themeIconActive.className = 'fa-regular fa-moon text-indigo-400';
        } else {
          themeIconActive.className = 'fa-solid fa-circle-half-stroke text-slate-500 dark:text-slate-400';
        }
      }
    }

    // Bind theme buttons (Desktop & Mobile)
    bindClick('btn-theme-light', () => applyTheme('light'));
    bindClick('btn-theme-dark', () => applyTheme('dark'));
    bindClick('btn-theme-system', () => applyTheme('system'));

    // Listen for OS system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentTheme === 'system') {
        applyTheme('system');
      }
    });

    // Apply initial theme immediately
    applyTheme(currentTheme);

    // Dropdown Click Handlers
    function setupDropdown(btnId, menuId) {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);
      if (!btn || !menu) return;
      
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = menu.classList.contains('opacity-0');
        
        // Hide all dropdowns
        document.querySelectorAll('.dropdown-menu').forEach(m => {
          m.classList.add('opacity-0', 'invisible', 'scale-95');
          m.classList.remove('opacity-100', 'visible', 'scale-100');
        });
        
        // Toggle this one
        if (isHidden) {
          menu.classList.remove('opacity-0', 'invisible', 'scale-95');
          menu.classList.add('opacity-100', 'visible', 'scale-100');
        }
      });
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(m => {
        m.classList.add('opacity-0', 'invisible', 'scale-95');
        m.classList.remove('opacity-100', 'visible', 'scale-100');
      });
    });

    setupDropdown('btn-examples-dropdown', 'menu-examples');
    setupDropdown('btn-export-dropdown', 'menu-export');
    setupDropdown('btn-theme-dropdown', 'menu-theme');
    setupDropdown('btn-mobile-menu', 'menu-mobile');

    // Start application on window load
    window.onload = function() {
      initUniver();
      initResizer();
    };

    /**
     * Initialize Draggable Split View Resizer
     */
    function initResizer() {
      const container = document.getElementById('split-container');
      const leftPanel = document.getElementById('left-panel');
      const rightPanel = document.getElementById('right-panel');
      const resizer = document.getElementById('resizer');

      let isDragging = false;
      let overlay = null;

      function isDesktop() {
        return window.innerWidth >= 768;
      }

      function startDrag(e) {
        isDragging = true;
        resizer.classList.add('is-dragging');
        
        // Add transparent full-screen overlay to catch all drag moves safely
        overlay = document.createElement('div');
        overlay.className = 'drag-overlay';
        overlay.style.cursor = isDesktop() ? 'col-resize' : 'row-resize';
        document.body.appendChild(overlay);

        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);
      }

      function onDrag(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isDesktop()) {
          // Horizontal Resizing for Desktop
          const offsetX = clientX - rect.left;
          const totalWidth = rect.width;
          let leftPercent = (offsetX / totalWidth) * 100;

          // Clamp resize bounds between 15% and 85%
          leftPercent = Math.max(15, Math.min(85, leftPercent));

          leftPanel.style.width = `${leftPercent}%`;
          rightPanel.style.width = `${100 - leftPercent}%`;
          leftPanel.style.height = '100%';
          rightPanel.style.height = '100%';
        } else {
          // Vertical Resizing for Mobile
          const offsetY = clientY - rect.top;
          const totalHeight = rect.height;
          let topPercent = (offsetY / totalHeight) * 100;

          // Clamp resize bounds between 15% and 85%
          topPercent = Math.max(15, Math.min(85, topPercent));

          leftPanel.style.height = `${topPercent}%`;
          rightPanel.style.height = `${100 - topPercent}%`;
          leftPanel.style.width = '100%';
          rightPanel.style.width = '100%';
        }

        // Trigger resize event so Univer spreadsheet redraws seamlessly
        window.dispatchEvent(new Event('resize'));
      }

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('is-dragging');

        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
          overlay = null;
        }

        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', stopDrag);

        window.dispatchEvent(new Event('resize'));
      }

      resizer.addEventListener('mousedown', startDrag);
      resizer.addEventListener('touchstart', startDrag, { passive: false });

      // Update responsive toolbar collapse based on left panel width (not whole window)
      function updatePanelResponsiveToolbar() {
        const width = leftPanel.offsetWidth;
        const desktopToolbar = document.getElementById('desktop-toolbar');
        const mobileMenuWrapper = document.getElementById('mobile-menu-wrapper');
        
        if (!desktopToolbar || !mobileMenuWrapper) return;
        
        // When left panel width is below 380px, collapse icon bar into hamburger menu
        if (width < 380) {
          desktopToolbar.classList.add('hidden');
          desktopToolbar.classList.remove('flex');
          mobileMenuWrapper.classList.remove('hidden');
          mobileMenuWrapper.classList.add('flex');
        } else {
          desktopToolbar.classList.remove('hidden');
          desktopToolbar.classList.add('flex');
          mobileMenuWrapper.classList.add('hidden');
          mobileMenuWrapper.classList.remove('flex');
        }
      }

      // Observe left panel width changes specifically (via drag resize or window resize)
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          updatePanelResponsiveToolbar();
        });
        ro.observe(leftPanel);
      }
      updatePanelResponsiveToolbar();

      // Handle viewport resize transitions gracefully
      window.addEventListener('resize', () => {
        if (!isDragging) {
          if (window.innerWidth < 768) {
            if (leftPanel.style.width && leftPanel.style.width.includes('%')) {
              leftPanel.style.width = '';
              rightPanel.style.width = '';
            }
          } else {
            if (leftPanel.style.height && leftPanel.style.height.includes('%')) {
              leftPanel.style.height = '';
              rightPanel.style.height = '';
            }
          }
        }
        updatePanelResponsiveToolbar();
      });
    }
  </script>
</body>
