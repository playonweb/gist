<!-- ═══════════════════════════════════════════════════════════════════════════
     GIST PLAY — Premium PWA Install Banner & Offline Manager
     Injected automatically into all apps unless 'Disable-PWA: true' or 'Disable-pwa: true' is set.
     ═══════════════════════════════════════════════════════════════════════════ -->
<div id="gist-pwa-banner-root">
  <style>
    #gist-pwa-pill {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999999;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      padding: 8px 14px 8px 10px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(12px) scale(0.96);
      opacity: 0;
    }

    #gist-pwa-pill.show {
      display: flex;
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    #gist-pwa-pill:hover {
      transform: translateY(-2px) scale(1.02);
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 14px 28px -5px rgba(99, 102, 241, 0.3), 0 0 0 1px rgba(99, 102, 241, 0.4);
    }

    #gist-pwa-pill .pwa-icon-wrap {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    #gist-pwa-pill .pwa-close-btn {
      margin-left: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }

    #gist-pwa-pill .pwa-close-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>

  <div id="gist-pwa-pill" title="Install this mini app as a standalone offline PWA">
    <div class="pwa-icon-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </div>
    <span>Install App</span>
    <div class="pwa-close-btn" id="gist-pwa-dismiss" title="Dismiss">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
  </div>

  <script>
    (function() {
      // Don't show inside standalone PWA window
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        return;
      }

      let deferredPrompt = null;
      const pill = document.getElementById('gist-pwa-pill');
      const dismissBtn = document.getElementById('gist-pwa-dismiss');
      const storageKey = 'gist-pwa-dismissed-' + (window.location.pathname || 'app');

      if (sessionStorage.getItem(storageKey)) return;

      // Always display the install button after 1s so the user can interact
      setTimeout(() => {
        if (pill && !sessionStorage.getItem(storageKey)) {
          pill.classList.add('show');
        }
      }, 1000);

      if (window.location.hash === '#install') {
        setTimeout(() => {
          if (pill) {
            pill.classList.add('show');
            pill.style.boxShadow = '0 0 0 4px rgba(99, 102, 241, 0.4), 0 0 20px rgba(99, 102, 241, 0.6)';
            pill.style.transform = 'translateY(0) scale(1.1)';
            history.replaceState(null, null, window.location.pathname + window.location.search);
          }
        }, 100);
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (pill) {
          pill.classList.add('show');
        }
      });

      if (pill) {
        pill.addEventListener('click', async (e) => {
          if (e.target.closest('#gist-pwa-dismiss')) return;
          
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              pill.classList.remove('show');
            }
            deferredPrompt = null;
          } else {
            // Fallback instruction for browsers / HTTP dev hosts
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            let msg = 'To install this app:\n\n';
            if (isIOS) {
              msg += 'Tap the Share button in Safari and select "Add to Home Screen".';
            } else {
              msg += 'Click the Install icon (💻/⬇️) in your browser address bar, or open Browser Menu -> "Install ' + document.title.split('-')[0].trim() + '" / "Add to Apps".';
            }
            alert(msg);
          }
        });
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (pill) pill.classList.remove('show');
          sessionStorage.setItem(storageKey, 'true');
        });
      }
    })();
  </script>
</div>
